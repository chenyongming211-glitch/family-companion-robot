name: StopWatch software AEC experiment
on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware-experiment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: m5stack-stopwatch
            board: m5stack/stopwatch
            target: esp32s3
          - variant: m5stack-stopwatch-software-aec
            board: m5stack/stopwatch
            target: esp32s3
          - variant: m5stack-stopwatch-xiaoman
            board: m5stack/stopwatch
            target: esp32s3
          - variant: esp32-s3-touch-amoled-2.16-xiaoman
            board: waveshare/esp32-s3-touch-amoled-2.16
            target: esp32s3
          - variant: xmini-c3-family
            board: xmini/c3
            target: esp32c3
    container:
      image: espressif/idf:v6.1
    env:
      VARIANT: ${{ matrix.variant }}
      BOARD: ${{ matrix.board }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install cloud build and real fixture test dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l
          apt-get update
          apt-get install -y --no-install-recommends libopus0 libssl-dev g++ cmake
      - name: Prepare fresh patched source in this isolated matrix job
        run: python3 firmware/tools/prepare_experiment.py --target "$TARGET"
      - name: Prepare pinned immutable network test fixture
        run: python3 firmware/tools/prepare_c3_fixtures.py --destination firmware/.cache/c3-network-fixture --cache-upstream-source
      - name: Run firmware host tests with real cue and network fixtures
        env:
          C3_NETWORK_COMPONENT: ${{ github.workspace }}/firmware/.cache/c3-network-fixture
          C3_PCM_CUE_ASSETS: ${{ github.workspace }}/firmware/.cache/experiment
        run: python3 -m unittest discover -s firmware/tests -v
      - name: Build selected board and variant from patched source
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          EXPECTED_IDF=$(python3 -c 'import json;print(json.load(open("firmware/upstream.lock.json"))["idf_commit"])')
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "$EXPECTED_IDF"
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          idf.py --version
          cd firmware/.cache/experiment
          python3 -m unittest discover -s scripts/tests -v
          BUILD_ARGS=()
          if [[ "$VARIANT" == xmini-c3-family ]]; then
            BUILD_ARGS+=(--wake-word disabled)
          fi
          python3 scripts/build.py "$BOARD" --name "$VARIANT" --language zh-CN --zip "${BUILD_ARGS[@]}"
      - name: Verify dependency bytes, effective config and source provenance; package evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 firmware/tools/verify_experiment.py \
            --tree firmware/.cache/experiment \
            --output firmware/.cache/evidence \
            --variant "$VARIANT" \
            --source-sha "$GITHUB_SHA" \
            --idf-commit "$(git -C "$IDF_PATH" rev-parse HEAD)"
          cd firmware/.cache/evidence
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stopwatch-patched-${{ matrix.variant }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: firmware/.cache/evidence/
      - name: Capture failed C3 archive sections
        if: ${{ failure() && matrix.variant == 'xmini-c3-family' }}
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, subprocess
          build = Path('firmware/.cache/experiment/build').resolve()
          out = build/'family_c3_cache/ldgen-debug'
          out.mkdir(parents=True, exist_ok=True)
          archive = build/'esp-idf/main/libmain.a'
          cache = build/'CMakeCache.txt'
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          inputs = {name: {'exists': (build/name).is_file(),
                          'sha256': sha(build/name) if (build/name).is_file() else None}
                    for name in ('esp-idf/main/libmain.a', 'CMakeCache.txt', 'build.ninja')}
          report = {'status': 'capture_error', 'locale': 'C', 'inputs': inputs,
                    'source_sha': os.environ.get('GITHUB_SHA'), 'dump_exit_code': None}
          def run(label, command):
              with (out/(label+'.txt')).open('wb') as stdout, (out/(label+'.stderr.txt')).open('wb') as stderr:
                  result = subprocess.run(command, env=dict(os.environ, LC_ALL='C'),
                                          stdout=stdout, stderr=stderr, timeout=30)
              (out/(label+'.exit.txt')).write_text(str(result.returncode)+'\n')
              return result.returncode
          try:
              if not cache.is_file():
                  raise ValueError('CMAKE_OBJDUMP cache missing')
              tools = re.findall(r'^CMAKE_OBJDUMP:[^=\r\n]+=(.*)$', cache.read_text(), re.MULTILINE)
              if len(tools) != 1 or not tools[0]:
                  raise ValueError('CMAKE_OBJDUMP must have exactly one nonempty cache entry')
              tool = Path(tools[0])
              if not tool.is_absolute() or not tool.is_file() or not os.access(tool, os.X_OK):
                  raise ValueError('CMAKE_OBJDUMP must be an existing absolute executable')
              report['tool'] = {'configured_path': str(tool), 'resolved_path': str(tool.resolve()),
                                'sha256': sha(tool)}
              report['version_exit_code'] = run('objdump-version', [str(tool), '--version'])
              if archive.is_file():
                  report['dump_command'] = [str(tool), '-h', str(archive)]
                  report['dump_exit_code'] = run('main-sections', report['dump_command'])
                  report['status'] = 'captured' if report['dump_exit_code'] == 0 else 'objdump_failed'
              else:
                  report['status'] = 'archive_missing'
          except Exception as error:
              report['error'] = type(error).__name__+': '+str(error)
          (out/'capture.json').write_text(json.dumps(report, indent=2, sort_keys=True)+'\n')
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Retain failed C3 build diagnostics only
        if: ${{ failure() && matrix.variant == 'xmini-c3-family' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c3-build-debug-only-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            firmware/.cache/experiment/build/xiaozhi.elf
            firmware/.cache/experiment/build/xiaozhi.map
            firmware/.cache/experiment/sdkconfig
            firmware/.cache/experiment/build/compile_commands.json
            firmware/.cache/experiment/build/family_c3_cache/
            firmware/.cache/experiment/build/esp-idf/main/libmain.a
            firmware/.cache/experiment/build/CMakeCache.txt
            firmware/.cache/experiment/build/build.ninja
