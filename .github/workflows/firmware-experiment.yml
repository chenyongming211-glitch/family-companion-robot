name: StopWatch software AEC experiment
on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware-experiment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: m5stack-stopwatch
            board: m5stack/stopwatch
          - variant: m5stack-stopwatch-software-aec
            board: m5stack/stopwatch
          - variant: m5stack-stopwatch-xiaoman
            board: m5stack/stopwatch
          - variant: esp32-s3-touch-amoled-2.16-xiaoman
            board: waveshare/esp32-s3-touch-amoled-2.16
    container:
      image: espressif/idf:v6.1
    env:
      VARIANT: ${{ matrix.variant }}
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run firmware host tests (synthetic loopback only)
        run: python3 -m unittest discover -s firmware/tests -v
      - name: Prepare fresh patched source in this isolated matrix job
        run: python3 firmware/tools/prepare_experiment.py
      - name: Build selected board and variant from patched source
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          EXPECTED_IDF=$(python3 -c 'import json;print(json.load(open("firmware/upstream.lock.json"))["idf_commit"])')
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "$EXPECTED_IDF"
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          idf.py --version
          cd firmware/.cache/experiment
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/build.py "$BOARD" --name "$VARIANT" --language zh-CN --zip
      - name: Verify dependency bytes, effective config and source provenance; package evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 firmware/tools/verify_experiment.py \
            --tree firmware/.cache/experiment \
            --output firmware/.cache/evidence \
            --variant "$VARIANT" \
            --source-sha "$GITHUB_SHA" \
            --idf-commit "$(git -C "$IDF_PATH" rev-parse HEAD)"
          cd firmware/.cache/evidence
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stopwatch-patched-${{ matrix.variant }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: firmware/.cache/evidence/
