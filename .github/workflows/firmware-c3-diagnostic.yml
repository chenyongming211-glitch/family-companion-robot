name: C3 exact-source diagnostic symbols
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit to rebuild for symbol matching
        required: true
        type: string
permissions:
  contents: read
jobs:
  c3-symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: espressif/idf:v6.1
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Require an exact source commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify source and SDK identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_IDF=$(python3 -c 'import json;print(json.load(open("firmware/upstream.lock.json"))["idf_commit"])')
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "$EXPECTED_IDF"
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Prepare exact C3 source
        run: python3 firmware/tools/prepare_experiment.py --target esp32c3
      - name: Build the C3 family variant
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          idf.py --version
          cd firmware/.cache/experiment
          python3 scripts/build.py xmini/c3 --name xmini-c3-family --language zh-CN --wake-word disabled --zip
      - name: Verify product evidence and retain exact build symbols
        shell: bash
        run: |
          set -euo pipefail
          python3 firmware/tools/verify_experiment.py \
            --tree firmware/.cache/experiment \
            --output firmware/.cache/evidence \
            --variant xmini-c3-family \
            --source-sha "$SOURCE_SHA" \
            --idf-commit "$(git -C "$IDF_PATH" rev-parse HEAD)"
          for NAME in xiaozhi.elf xiaozhi.map; do
            test -f "firmware/.cache/experiment/build/$NAME"
            test ! -L "firmware/.cache/experiment/build/$NAME"
            cp "firmware/.cache/experiment/build/$NAME" "firmware/.cache/evidence/build/$NAME"
          done
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess

          output = Path('firmware/.cache/evidence')
          (output/'source-sha.txt').write_text(os.environ['SOURCE_SHA']+'\n')
          idf_commit = subprocess.check_output(['git', '-C', os.environ['IDF_PATH'], 'rev-parse', 'HEAD'], text=True).strip()
          (output/'idf-commit.txt').write_text(idf_commit+'\n')
          (output/'workflow-sha.txt').write_text(os.environ['GITHUB_WORKFLOW_SHA']+'\n')
          paths = sorted(p for p in output.rglob('*') if p.is_file() and p.name != 'SHA256SUMS')
          assert all(not p.is_symlink() for p in paths)
          (output/'SHA256SUMS').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(output).as_posix()+'\n'
              for p in paths))
          PY
          cd firmware/.cache/evidence
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c3-diagnostic-${{ inputs.source_sha }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: firmware/.cache/evidence/
