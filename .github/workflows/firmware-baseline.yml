name: StopWatch stock firmware
on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install cloud build and real fixture test dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l
          apt-get update
          apt-get install -y --no-install-recommends libopus0 libssl-dev g++ cmake
      - name: Prepare verified stock source
        run: python3 firmware/tools/prepare.py
      - name: Prepare pinned immutable network test fixture
        run: python3 firmware/tools/prepare_c3_fixtures.py --destination firmware/.cache/c3-network-fixture --cache-upstream-source
      - name: Test source preparation and firmware with real fixtures
        env:
          C3_NETWORK_COMPONENT: ${{ github.workspace }}/firmware/.cache/c3-network-fixture
          C3_PCM_CUE_ASSETS: ${{ github.workspace }}/firmware/.cache/stock
        run: python3 -m unittest discover -s firmware/tests -v
      - name: Build stock StopWatch
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          EXPECTED_IDF=$(python3 -c 'import json;print(json.load(open("firmware/upstream.lock.json"))["idf_commit"])')
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "$EXPECTED_IDF"
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          idf.py --version
          cd firmware/.cache/stock
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/build.py m5stack/stopwatch --name m5stack-stopwatch --language zh-CN --zip
      - name: Verify stock original compile inputs and package checksummed evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 firmware/tools/verify_experiment.py \
            --baseline \
            --tree firmware/.cache/stock \
            --output firmware/.cache/baseline-evidence \
            --source-sha "$GITHUB_SHA" \
            --idf-commit "$(git -C "$IDF_PATH" rev-parse HEAD)"
          cd firmware/.cache/baseline-evidence
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stopwatch-stock-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: firmware/.cache/baseline-evidence/
