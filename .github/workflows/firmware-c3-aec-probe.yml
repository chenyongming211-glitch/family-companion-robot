name: C3 AEC resource probe
on:
  workflow_dispatch:
    inputs:
      aec_version:
        description: "Isolated probe library (product native lock is never modified)"
        type: choice
        options: ["2.4.7", "2.6.1"]
        default: "2.6.1"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: espressif/idf:v6.1
    env:
      AEC_VERSION: ${{ inputs.aec_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build locked standalone probe, never product firmware
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          EXPECTED_IDF=$(python3 -c 'import json;print(json.load(open("firmware/upstream.lock.json"))["idf_commit"])')
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "$EXPECTED_IDF"
          cp firmware/dependencies.esp32c3.lock firmware/probes/c3-aec/dependencies.lock
          cd firmware/probes/c3-aec
          python3 - <<'PY'
          import os,pathlib
          version=os.environ['AEC_VERSION']
          assert version in ('2.4.7','2.6.1')
          manifest=pathlib.Path('main/idf_component.yml')
          manifest.write_text(manifest.read_text().replace('"==2.4.7"',f'"=={version}"'))
          if version=='2.6.1':
              with open('sdkconfig.defaults','a') as f:f.write('\nCONFIG_C3_AEC_PROBE_FULL_DUPLEX=y\n')
          PY
          idf.py set-target esp32c3
          idf.py build
          python3 - <<'PY'
          import os,yaml
          resolved=yaml.safe_load(open('dependencies.lock'))
          locked=yaml.safe_load(open('../../dependencies.esp32c3.lock'))
          assert resolved['target']==locked['target']=='esp32c3'
          version=os.environ['AEC_VERSION']
          assert resolved['dependencies']['espressif/esp-sr']['version']==version
          expected_sr={'2.4.7':'809d0041cdddd98a278f0d5afef7bb60a451290577b98cf718dfffc91bdcbd9b',
                       '2.6.1':'7ba1e97d446440faa96a7d98fbda7dbaaf7ae6b960e06cc68264d38aa6eb4d14'}
          assert resolved['dependencies']['espressif/esp-sr']['component_hash']==expected_sr[version]
          for name,dependency in resolved['dependencies'].items():
              if name=='espressif/esp-sr':continue
              if version=='2.6.1' and name not in locked['dependencies']:
                  source=dependency['source']
                  assert source['type']=='service' and source['registry_url'].rstrip('/')=='https://components.espressif.com',name
                  continue
              assert name in locked['dependencies'], name
              original=locked['dependencies'][name]
              for field in ('version','component_hash','source'):
                  candidate,expected=dependency.get(field),original.get(field)
                  if version=='2.6.1' and field=='source' and candidate.get('type')==expected.get('type')=='service':
                      candidate=dict(candidate);expected=dict(expected)
                      candidate['registry_url']=candidate['registry_url'].rstrip('/')
                      expected['registry_url']=expected['registry_url'].rstrip('/')
                  assert candidate==expected, (name,field)
          print('Checked probe graph; product native lock was not modified; AEC version',version)
          PY
          mkdir evidence
          cp build/c3_aec_probe.bin build/c3_aec_probe.elf build/c3_aec_probe.map sdkconfig dependencies.lock evidence/
          cp ../../dependencies.esp32c3.lock evidence/product-native.lock
          cp managed_components/espressif__esp-sr/idf_component.yml evidence/sr-component.yml
          cp managed_components/espressif__esp-sr/include/esp32c3/esp_aec.h evidence/
          riscv32-esp-elf-nm -A -S managed_components/espressif__esp-sr/lib/esp32c3/libesp_audio_processor.a > evidence/sr-symbols.txt
          sha256sum managed_components/espressif__esp-sr/lib/esp32c3/*.a > evidence/sr-library-sha256.txt
          git -C "$IDF_PATH" rev-parse HEAD > evidence/idf-commit.txt
          echo "$GITHUB_SHA" > evidence/source-sha.txt
          echo "$AEC_VERSION" > evidence/probe-aec-version.txt
          cd evidence
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c3-aec-resource-probe-${{ inputs.aec_version }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: firmware/probes/c3-aec/evidence/
